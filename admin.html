<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TALISM — Private Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth-card">
      <p class="eyebrow">TALISM / PRIVATE ACCESS</p>
      <h1>Welcome to the atelier</h1>
      <p class="muted">Sign in with the authorized staff account to manage the live catalog.</p>
      <form id="login-form" class="stack">
        <label>Email<input id="email" type="email" autocomplete="username" required placeholder="staff email"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="password"></label>
        <button class="button dark" type="submit">Enter dashboard</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-view" class="app-view hidden">
      <header class="topbar"><div><p class="eyebrow">TALISM / CATALOG STUDIO</p><h1>Product collection</h1></div><button id="logout" class="button quiet">Sign out</button></header>
      <div class="layout">
        <section class="panel form-panel"><div class="panel-head"><div><p class="eyebrow">EDIT PIECE</p><h2 id="form-title">Add a product</h2></div><button id="cancel-edit" class="text-button hidden" type="button">Clear</button></div>
          <form id="product-form" class="stack">
            <input id="product-id" type="hidden">
            <label>Product name<input id="name" required minlength="2" maxlength="180"></label>
            <label>Category<select id="category" required><option>Abayas &amp; Kimonos</option><option>Elegant Kaftans</option><option>Modest Maxi Dresses</option><option>Hijabs &amp; Niqabs</option><option>Minimalist Handbags</option><option>Signature Scents</option></select></label>
            <label>Price<input id="price" required placeholder="TZS 100,000"></label>
            <label>Description<textarea id="description" rows="4"></textarea></label>
            <label>Cover image<input id="cover-image" type="file" accept="image/jpeg,image/png,image/webp" required></label>
            <label class="check"><input id="is-published" type="checkbox"> <span>Publish to storefront</span></label>
            <button class="button dark" type="submit"><span id="save-label">Save product</span></button>
            <p id="form-message" class="message" role="status"></p>
          </form>
        </section>
        <section class="panel"><div class="panel-head"><div><p class="eyebrow">LIVE CATALOG</p><h2>Manage products</h2></div><input id="search" class="search" placeholder="Search catalog"></div><div id="product-list" class="product-list"></div></section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
